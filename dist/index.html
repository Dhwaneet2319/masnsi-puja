  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mansi Puja Fun!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              heading: ['Fredoka', 'sans-serif'],
              body: ['Nunito', 'sans-serif'],
            },
            colors: {
              primary: {
                DEFAULT: '#FF9F43', // Soft Orange
                light: '#FFD3A3',
                dark: '#E58E3B',
              },
              secondary: {
                DEFAULT: '#48DBFB', // Sky Blue
                light: '#9DEDFD',
              },
              accent: {
                DEFAULT: '#1DD1A1', // Mint Green
              },
              cream: '#FEF9E7',
              danger: '#FF6B6B',
            },
            animation: {
              'float': 'float 3s ease-in-out infinite',
              'bounce-slow': 'bounce 3s infinite',
              'spin-slow': 'spin 8s linear infinite',
              'wiggle': 'wiggle 1s ease-in-out infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              wiggle: {
                '0%, 100%': { transform: 'rotate(-3deg)' },
                '50%': { transform: 'rotate(3deg)' },
              }
            }
          },
        },
      }
    </script>
    <style>
      body {
        background-color: #FEF9E7;
        font-family: 'Nunito', sans-serif;
        overflow-x: hidden;
      }
      
      /* Fun Background Pattern */
      .fun-pattern {
        position: fixed;
        inset: 0;
        background: linear-gradient(180deg, #FFF6E8 0%, #FFE5F2 45%, #E3F7FF 100%);
        opacity: 1;
        overflow: hidden;
      }

      .fun-pattern::before,
      .fun-pattern::after {
        content: '';
        position: absolute;
        width: 140%;
        height: 140%;
        left: -20%;
        top: -20%;
        background-image:
          radial-gradient(circle at 20% 25%, rgba(255, 200, 155, 0.7) 0%, transparent 45%),
          radial-gradient(circle at 70% 20%, rgba(157, 237, 253, 0.65) 0%, transparent 40%),
          radial-gradient(circle at 35% 70%, rgba(255, 182, 193, 0.55) 0%, transparent 50%),
          radial-gradient(circle at 80% 70%, rgba(29, 209, 161, 0.45) 0%, transparent 40%);
        animation: floatShapes 38s linear infinite;
        opacity: 0.75;
      }

      .fun-pattern::after {
        animation: floatShapesReverse 32s linear infinite;
        opacity: 0.5;
        transform: scale(1.1);
        filter: blur(10px);
      }

      @keyframes floatShapes {
        0% { transform: translate3d(0, 0, 0) rotate(0deg); }
        50% { transform: translate3d(4%, -6%, 0) rotate(8deg); }
        100% { transform: translate3d(0, -12%, 0) rotate(16deg); }
      }

      @keyframes floatShapesReverse {
        0% { transform: translate3d(0, 0, 0) rotate(0deg) scale(1.1); }
        50% { transform: translate3d(-4%, 5%, 0) rotate(-6deg) scale(1.15); }
        100% { transform: translate3d(-2%, 10%, 0) rotate(-12deg) scale(1.1); }
      }

      h1, h2, h3, h4, h5, h6 {
        font-family: 'Fredoka', sans-serif;
      }
      
      /* Custom Scrollbar for cute look */
      ::-webkit-scrollbar {
        width: 12px;
      }
      ::-webkit-scrollbar-track {
        background: #FEF9E7;
      }
      ::-webkit-scrollbar-thumb {
        background-color: #FFD3A3;
        border-radius: 20px;
        border: 3px solid #FEF9E7;
      }
    </style>
